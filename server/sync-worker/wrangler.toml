name = "called-sync"
main = "src/index.js"
compatibility_date = "2026-01-01"

[vars]
# Comma-separated list of sites allowed to call this worker.
ALLOWED_ORIGINS = "https://allcattlenobull.github.io"

# Create the namespace with: npx wrangler kv namespace create JOURNEYS
# then paste the id below.
[[kv_namespaces]]
binding = "JOURNEYS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Optional: throttle each IP to 60 requests per minute.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
