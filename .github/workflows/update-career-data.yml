name: Update career data

# Refreshes wage figures from the U.S. Bureau of Labor Statistics public API and opens a
# pull request for human review. The app never depends on this running.
on:
  schedule:
    - cron: '17 9 2 * *' # monthly, 2nd day, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check data source keys
        # Reports which API keys are set and accepted (never prints them). Never fails the run.
        run: node scripts/check-data-keys.mjs
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          COLLEGE_SCORECARD_API_KEY: ${{ secrets.COLLEGE_SCORECARD_API_KEY }}
          ONET_API_KEY: ${{ secrets.ONET_API_KEY }}
          CAREERONESTOP_USER_ID: ${{ secrets.CAREERONESTOP_USER_ID }}
          CAREERONESTOP_TOKEN: ${{ secrets.CAREERONESTOP_TOKEN }}
      - name: Fetch latest wages
        run: npm run data:update
        env:
          # Optional. Without a key the BLS API allows fewer requests per day.
          # Repository secret BLS_API_KEY (Settings > Secrets and variables > Actions). Never commit keys.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - name: Fetch reviewed state market data
        run: npm run data:update:market
        env:
          # Optional official/API export transformed to state-market.json's schema.
          # Keep credentials in the source service or GitHub secret, never in this repo.
          STATE_MARKET_DATA_URL: ${{ secrets.STATE_MARKET_DATA_URL }}
      - name: Validate data
        run: npm run data:validate
      - name: Open pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi
          branch="data/update-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/careers/overrides/wages.json src/data/market/state-market.json
          git commit -m "Update career wage data from BLS"
          git push origin "$branch"
          gh pr create --title "Update career market data" --body "Automated refresh from official national/state market sources. Review changes before merging; see docs/DATA.md." --base main --head "$branch"
